# Реверс-прокси для Mini App (Этап 0, issue #15) на VPS, общем с
# reeltrack-bot (issue #21). Не деплоится автоматически — как и
# deploy-run.sh (см. рядом), версионируется здесь для истории и ревью,
# устанавливается на сервер вручную:
#
#   scp deploy/nginx/app.bimoool.com.conf \
#       root@<VPS_HOST>:/etc/nginx/sites-available/app.bimoool.com.conf
#   ssh root@<VPS_HOST> 'ln -s /etc/nginx/sites-available/app.bimoool.com.conf \
#       /etc/nginx/sites-enabled/app.bimoool.com.conf && nginx -t && systemctl reload nginx'
#
# Затем сертификат: certbot --nginx -d app.bimoool.com — certbot сам
# допишет `listen 443 ssl`, `ssl_certificate*` и редирект с 80 на 443 в
# этот же файл (не создаёт отдельный).
#
# Самостоятельный файл на отдельный server_name — не трогает конфиг
# reeltrack-bot (или любого другого поддомена на этом же VPS), даже если
# тот тоже живёт под nginx на хосте.
#
# Порт бэкенда — 127.0.0.1:8001, сервис `web` из docker-compose.yml
# (MINI_APP_PORT, дефолт 8001, не 8000 — см. issue #19: 8000 на проде
# занят чужим процессом). Публикуется только на 127.0.0.1 самим
# docker-compose — proxy_pass ниже обязан ходить на loopback, не 0.0.0.0.

server {
    listen 80;
    listen [::]:80;
    server_name app.bimoool.com;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
