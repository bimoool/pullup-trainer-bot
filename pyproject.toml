[project]
name = "pullup-trainer-bot"
version = "0.1.0"
description = "Telegram-бот-тренер по подтягиваниям"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.9",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.4",
    "gspread>=6.1",
    "openpyxl>=3.1",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",
]
# Отдельный веб-сервис (app/web/, Mini App) — свой Docker-образ
# (Dockerfile.web), не тянется в основной образ бота (Dockerfile). httpx —
# только для тестов эндпоинтов (FastAPI TestClient), не рантайм-зависимость.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Валидация подписи Telegram initData (HMAC-SHA256 по спеке Telegram) —
    # готовая, тестируемая библиотека вместо самодельной реализации (issue
    # #15, комментарий от 2026-08-31: taiga-labs/telegram-miniapp-template
    # как референс, init-data-py/telegram-webapps-authentication как
    # готовые варианты). init-data-py — минимальная поверхность (parse +
    # validate), без привязки к конкретному веб-фреймворку — FastAPI-
    # интеграция (Depends) написана тонким слоем в app/web/auth.py, тем же
    # принципом "своя обвязка поверх готовой библиотеки", что и остальной
    # проект (не app/bot/handlers пишет HTTP-клиент Robokassa сам, см.
    # app/services/robokassa.py).
    "init-data-py>=0.2.7,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
