name: E2E (Mini App)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-changed-paths.yml

  webkit-fresh-diagnostic:
    name: WebKit fresh course (synthetic local diagnosis)
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_full != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pullup
          POSTGRES_PASSWORD: pullup
          POSTGRES_DB: pullup_qa_fresh_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pullup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pullup:pullup@localhost:5432/pullup_qa_fresh_local
      BOT_TOKEN: ci-test-token
      STAGING_URL: http://127.0.0.1:8001
      STAGING_BOT_TOKEN: ci-test-token
      STAGING_PROJECT: iphone-webkit
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/install-python.sh dev
      - run: alembic upgrade head
      - name: Seed reserved fresh identity in fixed local database
        run: python -m scripts.qa.seed_local_fresh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build real frontend
        working-directory: webapp-frontend
        run: |
          npm ci
          npm run build
      - name: Install WebKit diagnostic dependencies
        working-directory: webapp-frontend/e2e-staging
        run: |
          npm ci
          npx playwright install --with-deps webkit
          npm run typecheck
      - name: Start real local API
        run: |
          nohup uvicorn app.web.main:app --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/local-fresh-api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/health > /dev/null && exit 0
            sleep 1
          done
          echo "Local diagnostic API did not become healthy"
          exit 1
      - name: Diagnose exact fresh journey (no retries, real local API)
        working-directory: webapp-frontend/e2e-staging
        run: |
          set -uo pipefail
          if npx playwright test --config=playwright.local-fresh.config.ts --retries=0 > "$RUNNER_TEMP/local-fresh-playwright.log" 2>&1; then
            result=0
          else
            result=$?
          fi
          echo "Synthetic local WebKit fresh diagnosis exit=$result"
          if [ -f test-results/release-status.json ]; then
            cat test-results/release-status.json
            echo
          fi
          exit "$result"
      - name: Upload synthetic diagnostic screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-webkit-fresh-screenshots
          path: webapp-frontend/e2e-staging/test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_full != 'false') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pullup
          POSTGRES_PASSWORD: pullup
          POSTGRES_DB: pullup_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pullup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pullup:pullup@localhost:5432/pullup_e2e
      BOT_TOKEN: e2e-test-token
      # Экран сессии v2 (issue #185) виден только admin — три id ниже
      # соответствуют сидам v2_session_* в scripts/e2e_seed.py.
      ADMIN_IDS: "900010,900011,900012"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: bash scripts/install-python.sh dev

      - name: Apply migrations
        run: alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: webapp-frontend
        run: |
          npm ci
          npm run build

      - name: Start API server
        run: |
          export E2E_PLAN_CALENDAR_AT="$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).isoformat())')"
          echo "E2E_PLAN_CALENDAR_AT=$E2E_PLAN_CALENDAR_AT" >> "$GITHUB_ENV"
          nohup uvicorn tests.support.e2e_calendar_app:app --host 127.0.0.1 --port 8001 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/health && exit 0
            sleep 1
          done
          echo "server did not become healthy in time" && cat uvicorn.log && exit 1

      - name: Seed E2E scenarios
        # not_onboarded (900001) не сеет ничего — статус означает
        # отсутствие строки users, см. scripts/e2e_seed.py::seed_not_onboarded.
        env:
          E2E_CALENDAR_FIXTURE: "1"
        run: scripts/e2e_seed_all.sh

      - name: Install E2E dependencies
        working-directory: webapp-frontend/e2e
        run: npm ci

      - name: Typecheck functional E2E
        id: typecheck
        working-directory: webapp-frontend/e2e
        run: npm run typecheck

      - name: Install Playwright
        working-directory: webapp-frontend/e2e
        run: |
          npx playwright install --with-deps chromium

      # Peer insights читает общую когорту всей e2e-БД — отдельным шагом до спеков, которые пишут результаты тестов
      # (playwright.config.ts, PEER_SPEC). Основной шаг идёт и при его падении; итог job — красный, если упал любой.
      - name: Run Playwright peer-insights (before other specs write results)
        id: peer
        working-directory: webapp-frontend/e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8001
        run: npx playwright test --project=peer-insights --reporter=list --output=test-results-peer

      - name: Run Playwright tests
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        working-directory: webapp-frontend/e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8001
          E2E_SKIP_PEER_PROJECT: "1"
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webapp-frontend/e2e/playwright-report/
          retention-days: 14

      - name: Dump server logs on failure
        if: failure()
        run: cat uvicorn.log
