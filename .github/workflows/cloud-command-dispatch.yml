name: Cloud guarded command dispatcher

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: cloud-command-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'bimoool/pullup-trainer-bot' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/pullup ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The workflow and Python adapter are from the same trusted default-branch commit.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Authorize, claim once and request fixed guarded preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/guarded_comment_dispatch.py
