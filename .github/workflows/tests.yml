name: Tests

# До issue #171 `pytest`/`ruff` не запускались НИ В ОДНОМ workflow — 1139
# тестов гонялись только локально, вручную, автором продукта. Практический
# эффект был подтверждён дважды за одну сессию: сломанный `test_hello.py`
# (новое поле `is_admin` не добавили в старые ассерты) нашёлся глазами уже
# после мержа, а расхождение backfill/Dashboard — вообще вручную в Telegram.
# Этот workflow закрывает дыру: любой PR и любой push в main проверяется
# автоматически, до того как ветку кто-то смержит или задеплоит.

# Every PR reports named checks. Only verified Markdown-only changes skip heavy jobs;
# incomplete API data or an unknown path runs the full gate. See ci-changed-paths.yml.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Новый push в ту же ветку отменяет предыдущий прогон — не жечь раннеры
  # на заведомо устаревшем коде.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-changed-paths.yml

  lint:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_full != 'false') }}
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: bash scripts/install-python.sh dev
      - run: ruff check app/ tests/ scripts/
      - run: ruff format --check app/ tests/ scripts/
        continue-on-error: true

  pytest:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_full != 'false') }}
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        # tests/conftest.py ожидает pullup:pullup@localhost/pullup_test
        # (переопределяется TEST_DATABASE_URL) — те же креды, что e2e.yml.
        image: postgres:16
        env:
          POSTGRES_USER: pullup
          POSTGRES_PASSWORD: pullup
          # Именно `pullup`, не `pullup_test`: tests/conftest.py
          # (_ensure_database_exists) подключается к служебной базе `pullup`
          # и САМ создаёт из неё pullup_test. Без неё весь набор падает
          # с InvalidCatalogNameError — 699 ошибок на первом прогоне CI.
          POSTGRES_DB: pullup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pullup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://pullup:pullup@localhost:5432/pullup_test
      DATABASE_URL: postgresql+asyncpg://pullup:pullup@localhost:5432/pullup_test
      BOT_TOKEN: ci-test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: bash scripts/install-python.sh dev
      # Миграции отдельным шагом НЕ нужны: tests/conftest.py сам создаёт
      # pullup_test и накатывает на неё `alembic upgrade head`
      # (фикстура test_dsn). Отдельный шаг здесь только падал, потому что
      # целевой базы на тот момент ещё не существует.
      - name: Run tests
        run: |
          pytest -q --maxfail=20
          python -m scripts.e2e_seed ready 936600
          pytest -q --maxfail=20

  frontend:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_full != 'false') }}
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # native TypeScript type stripping for tests/*.test.ts
          cache: npm
          cache-dependency-path: webapp-frontend/package-lock.json
      - working-directory: webapp-frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: webapp-frontend
        run: npm run build
      - name: Unit tests (protocol config)
        working-directory: webapp-frontend
        run: npm run test:unit
      # issue #306: те же JSON-векторы Live Engine v2, что pytest (contracts/live_engine_vectors.json).
      - name: Live Engine v2 shared vectors (vitest)
        working-directory: webapp-frontend
        run: npm run test:vectors

  python-locks:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_full != 'false') }}
    name: Python locks (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode: [runtime, web, dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Two clean installations must agree
        shell: bash
        run: |
          for attempt in 1 2; do
            python -m venv "$RUNNER_TEMP/lock-$attempt"
            PYTHON="$RUNNER_TEMP/lock-$attempt/bin/python" bash scripts/install-python.sh '${{ matrix.mode }}'
            "$RUNNER_TEMP/lock-$attempt/bin/python" -m pip freeze --exclude-editable | sort > "$RUNNER_TEMP/freeze-$attempt.txt"
          done
          diff -u "$RUNNER_TEMP/freeze-1.txt" "$RUNNER_TEMP/freeze-2.txt"
          "$RUNNER_TEMP/lock-1/bin/python" -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
      - name: Regeneration must leave locks unchanged
        if: matrix.os == 'ubuntu-latest' && matrix.mode == 'dev'
        run: |
          python -m pip install uv==0.13.4
          bash scripts/lock-python.sh
          git diff --exit-code -- requirements/
