name: Deploy Staging

# Отдельный, полностью изолированный от прода контур. Ключевое отличие от
# deploy.yml: тот вызывает ./deploy.sh на сервере (скрипт живёт там же, не
# в репо) в уже существующий checkout прода. Здесь вместо этого — свой
# checkout (/opt/pullup-trainer-bot-staging), свой .env.staging (другой
# BOT_TOKEN, другая POSTGRES_DB), и главное — свой docker compose PROJECT
# NAME (-p pullup-staging), из-за которого volumes/network/имена
# контейнеров физически не пересекаются с прод-проектом ни при каких
# обстоятельствах, даже при ошибке в конфиге.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка/коммит для деплоя на staging"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS (staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.241.141.47
          username: deploy
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            STAGING_DIR=/opt/pullup-trainer-bot-staging
            if [ ! -d "$STAGING_DIR" ]; then
              git clone https://github.com/bimoool/pullup-trainer-bot.git "$STAGING_DIR"
            fi
            cd "$STAGING_DIR"
            git fetch origin
            git checkout "${{ inputs.ref }}"
            git pull origin "${{ inputs.ref }}" --ff-only || true
            # .env.staging заводится один раз вручную на сервере (см.
            # .env.staging.example в репозитории) — с отдельным BOT_TOKEN,
            # отдельным MINI_APP_PORT, отдельным POSTGRES_DB. Не создаём
            # здесь автоматически, чтобы не затереть секреты случайно.
            if [ ! -f .env ]; then
              echo "ОШИБКА: .env отсутствует в $STAGING_DIR — см. .env.staging.example, завести один раз вручную." && exit 1
            fi
            docker compose -p pullup-staging up -d --build
            for i in $(seq 1 30); do
              docker compose -p pullup-staging exec -T app python -m alembic upgrade head && break
              sleep 2
            done
            sleep 5
            # Порт зафиксирован соглашением (см. .env.staging.example) —
            # не читаем .env в шелл staging-скрипта, чтобы не тащить туда
            # секреты вроде BOT_TOKEN лишним echo/set -a.
            curl -sf "http://127.0.0.1:8002/health" || (echo "health check failed" && exit 1)
