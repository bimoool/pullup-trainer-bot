name: Deploy Staging

# Отдельный, полностью изолированный от прода контур. Свой SSH-ключ
# (VPS_STAGING_DEPLOY_SSH_KEY), ограниченный на сервере отдельным
# forced-command wrapper'ом (deploy-staging-dispatch.sh), не пересекается с
# production-ключом/ограничением. Секреты STAGING_BOT_TOKEN/STAGING_CLONE_TOKEN
# читаются скриптом на сервере из ~/.staging-secrets.env, а не прокидываются
# через SSH-команду — issue #169.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка для деплоя на staging"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS (staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_STAGING_DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: ./deploy-staging.sh ${{ inputs.ref }}
