name: Cloud control tests
on:
  pull_request:
    paths:
      - tools/cloud_control.py
      - tools/tests/test_cloud_control.py
      - .github/workflows/cloud-control-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -v
