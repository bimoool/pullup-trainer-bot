name: Cloud command authorization tests
on:
  pull_request:
    paths:
      - tools/guarded_comment_dispatch.py
      - tools/tests/test_guarded_comment_dispatch.py
      - .github/workflows/cloud-command-dispatch.yml
      - .github/workflows/cloud-command-tests.yml
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools/tests -v
