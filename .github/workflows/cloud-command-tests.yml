name: Cloud command authorization tests
on:
  pull_request:
    paths:
      - deploy/server-control.py
      - deploy/prod-guarded-dispatch.sh
      - deploy/install-server-control.py
      - tools/server_control_client.py
      - tools/tests/test_server_control*.py
      - .github/workflows/server-control.yml
      - deploy/install-staging-qa-access.py
      - deploy/qa-staging.sh
      - deploy/staging-qa-access-dispatch.sh
      - tools/tests/test_staging_qa_access.py
      - tools/current_checks.py
      - tools/tests/check_fixtures.py
      - tools/tests/test_current_checks.py
      - tools/guarded_comment_dispatch.py
      - tools/tests/test_guarded_comment_dispatch.py
      - .github/workflows/cloud-command-dispatch.yml
      - .github/workflows/cloud-command-tests.yml
      - .github/workflows/deploy-staging-guarded.yml
      - .github/workflows/staging-snapshot.yml
      - .github/workflows/staging-qa.yml
      - .github/workflows/release-qa.yml
      - .github/workflows/production-deploy.yml
      - .github/workflows/rehearsal-harness.yml
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools/tests -v
