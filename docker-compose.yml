services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pullup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pullup}
      POSTGRES_DB: ${POSTGRES_DB:-pullup}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pullup}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Публикуем на ЭФЕМЕРНОМ порту хоста (Docker сам выбирает свободный) —
    # app всё равно общается с db по внутренней сети, а этот порт нужен
    # только тестам/psql с хоста. Эфемерность исключает конфликт с другими
    # локальными проектами (см. историю Этапа 0): узнать порт можно через
    # `docker compose port db 5432`. На этом же порту, в этом же контейнере,
    # initdb-скрипт создаёт вторую базу pullup_test — для интеграционных
    # тестов, изолированно от dev-базы pullup.
    ports:
      - "127.0.0.1::5432"

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m app.main' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
