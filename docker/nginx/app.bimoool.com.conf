# Mini App (Этап 0) — reverse proxy для app.bimoool.com -> сервис web
# (docker-compose.yml), опубликованный ТОЛЬКО на 127.0.0.1:${MINI_APP_PORT:-8081}.
#
# Это конфиг ДЛЯ ХОСТ-УРОВНЯ nginx (не контейнер) — копируется вручную на
# сервер человеком с SSH-доступом, см. чек-лист в CLAUDE.md, раздел
# "Mini App: Этап 0". Не применяется автоматически ни при push, ни при
# `docker compose up`.
#
# Перед использованием проверить на сервере (см. чек-лист в CLAUDE.md):
# - есть ли уже host-level nginx (например, под reeltrack-bot) — если да,
#   этот файл кладётся туда же, где лежат его существующие server{}-блоки
#   (обычно /etc/nginx/sites-available/, симлинк в sites-enabled/); если
#   нет — придётся сначала поставить nginx на хост (apt install nginx).
# - совпадает ли порт ${MINI_APP_PORT:-8081} ниже с тем, что реально
#   настроено в .env на сервере.
#
# Порядок выпуска сертификата (certbot, webroot-режим — не трогает уже
# работающий reeltrack-bot, не поднимает свой отдельный HTTP-сервер):
#   1. Положить этот файл в sites-available/, включить только блок :80 ниже
#      (закомментировать или временно убрать блок :443 — сертификата ещё нет).
#   2. sudo mkdir -p /var/www/certbot
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot certonly --webroot -w /var/www/certbot -d app.bimoool.com
#   5. Раскомментировать блок :443 (сертификат уже на диске), nginx -t && reload.
#   6. Certbot сам ставит cron/systemd timer на автопродление — ничего
#      дополнительно настраивать не нужно.

server {
    listen 80;
    listen [::]:80;
    server_name app.bimoool.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.bimoool.com;

    ssl_certificate     /etc/letsencrypt/live/app.bimoool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.bimoool.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
